dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.3
