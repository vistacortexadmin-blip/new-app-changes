name: vistacortex_new_features
description: "VistaCortex Patient Healthcare Management Platform - Complete PRD Implementation."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  uuid: ^4.6.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.2
  firebase_analytics: ^11.3.6
  image_picker: ^1.2.3
  flutter_svg: ^2.0.10+1
  supabase_flutter: ^2.18.0
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.3.4
  flutter_local_notifications: ^23.0.0-dev.2
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  connectivity_plus: ^7.3.2
  path_provider: ^2.1.6
  flutter_riverpod: 2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.16.1
  hive_ce_generator: ^1.11.3

flutter:
